services:
  - type: web
    name: saudi-goods-classifier
    env: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -e . sentence-transformers faiss-cpu"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
